name: xcodebuild

on:
  push:
    branches:
      - cursor/blackout-bible-v3-64d0
      - main
  # Work integrates on bible-v3, not main, so a PR that only targeted main was
  # never compiled before it merged. Compile the branch people actually review.
  pull_request:
    branches:
      - main
      - cursor/blackout-bible-v3-64d0

jobs:
  build:
    name: Blackout generic iOS device
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Fail closed on CI opt / CPV gates
        run: python3 tools/test_ci_opt.py

      - name: Select Xcode 16
        run: |
          set -euo pipefail
          ls /Applications | grep -i xcode || true
          xcodebuild -version || true
          for app in \
            /Applications/Xcode_16.4.app \
            /Applications/Xcode_16.3.app \
            /Applications/Xcode_16.2.app \
            /Applications/Xcode_16.1.app \
            /Applications/Xcode_16.0.app \
            /Applications/Xcode_16.app \
            /Applications/Xcode.app
          do
            if [ -d "$app" ]; then
              sudo xcode-select -s "$app"
              break
            fi
          done
          xcodebuild -version
          xcode-select -p

      - name: Build Blackout (unsigned compile of all scheme targets)
        run: |
          set -euo pipefail
          xcodebuild \
            -project Blackout.xcodeproj \
            -scheme Blackout \
            -destination 'generic/platform=iOS' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            DEVELOPMENT_TEAM= \
            build

  render:
    # Every other guard in this repo reads bytes. This one boots a simulator and
    # asks the map what it actually drew, because "the pack renders" is the claim
    # no file check can make and the only one whose failure ships a blank screen.
    name: Map renders a street
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          set -euo pipefail
          for app in /Applications/Xcode_16.4.app /Applications/Xcode_16.3.app \
                     /Applications/Xcode_16.2.app /Applications/Xcode_16.1.app \
                     /Applications/Xcode_16.app /Applications/Xcode.app
          do
            if [ -d "$app" ]; then sudo xcode-select -s "$app"; break; fi
          done
          xcodebuild -version

      - name: Pick an iPhone simulator
        id: sim
        run: |
          set -euo pipefail
          xcrun simctl list devices available
          udid=$(xcrun simctl list devices available \
            | sed -n '/-- iOS 1[89]/,/^-- /p;/-- iOS [2-9][0-9]/,/^-- /p' \
            | grep iPhone \
            | grep -oE '[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}' \
            | head -1)
          test -n "$udid" || { echo 'no iOS 18+ iPhone simulator on this runner'; exit 1; }
          echo "picked $udid"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$udid" || true

      - name: Render the shipped pack
        working-directory: Packages/MapLibreMap
        run: |
          set -euo pipefail
          set -o pipefail
          xcodebuild test \
            -scheme MapLibreMap \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -only-testing:MapLibreMapTests/VectorTileRenderTests \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee render.log

      - name: What each pmtiles spelling did
        if: always()
        working-directory: Packages/MapLibreMap
        run: grep 'PMTILES-SPELLING' render.log || echo 'probe produced no spelling lines'
