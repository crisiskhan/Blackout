# No human p12. ASC AuthKey creates or reuses Distribution cert + App Store profiles.
# workflow_dispatch only. Never pull_request or push.
# Default unsigned compile is xcodebuild.yml and must stay green without these secrets.
name: TestFlight Internal

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: "App tree to archive (not main)"
        required: true
        default: cursor/blackout-bible-v3-64d0

jobs:
  upload:
    name: AuthKey archive + Internal upload
    runs-on: macos-latest
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_APP_ID: "6806388963"
      ASC_INTERNAL_GROUP_ID: "28035586-fce6-474f-9bc2-ef0f1f65306e"
    steps:
      - name: Require ASC AuthKey secrets
        run: |
          set -euo pipefail
          for name in APP_STORE_CONNECT_API_KEY APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_KEY_ID APPLE_TEAM_ID
          do
            eval "val=\${$name:-}"
            if [ -z "$val" ]; then
              echo "Required secret $name is empty. No archive. No upload."
              exit 1
            fi
          done
          echo "ASC AuthKey secrets are present (values not printed)."

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref }}

      - name: Select Xcode
        run: |
          set -euo pipefail
          ls /Applications | grep -i xcode || true
          xcodebuild -version || true
          for app in \
            /Applications/Xcode_16.4.app \
            /Applications/Xcode_16.3.app \
            /Applications/Xcode_16.2.app \
            /Applications/Xcode_16.1.app \
            /Applications/Xcode_16.0.app \
            /Applications/Xcode_16.app \
            /Applications/Xcode_26.6.app \
            /Applications/Xcode_26.5.app \
            /Applications/Xcode.app
          do
            if [ -d "$app" ]; then
              sudo xcode-select -s "$app"
              break
            fi
          done
          xcodebuild -version
          xcode-select -p

      - name: Write AuthKey
        run: |
          set -euo pipefail
          KEYDIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$KEYDIR"
          HOME_KEY="$KEYDIR/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          TEMP_KEY="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$(printf '%s' "$APP_STORE_CONNECT_API_KEY" | tr -d '\r')" > "$HOME_KEY"
          cp "$HOME_KEY" "$TEMP_KEY"
          chmod 600 "$HOME_KEY" "$TEMP_KEY"
          echo "AUTH_KEY_PATH=$TEMP_KEY" >> "$GITHUB_ENV"
          echo "AuthKey written (path only, not contents)."

      - name: Python JWT venv
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/py"
          "$RUNNER_TEMP/py/bin/pip" install -q PyJWT cryptography
          echo "PYBIN=$RUNNER_TEMP/py/bin/python" >> "$GITHUB_ENV"

      - name: Create or reuse Distribution cert and App Store profiles
        run: |
          set -euo pipefail
          "$PYBIN" << 'PY'
          import json, os, subprocess, time, urllib.error, urllib.parse, urllib.request
          from pathlib import Path
          import jwt

          STOP = (
              "ASC API key cannot create or reuse signing certificates. "
              "In App Store Connect → Users and Access → Integrations → App Store Connect API, "
              "the key’s role must be Admin or Account Holder (not Developer, not App Manager). "
              "Account Holder/Admin: edit or replace APP_STORE_CONNECT_API_KEY with an Admin key."
          )
          BUNDLES = [
              ("com.crisiskhan.blackout", "Blackout iOS App Store GHA", "IOS"),
              ("com.crisiskhan.blackout.widgets", "Blackout Widgets App Store GHA", "IOS"),
              ("com.crisiskhan.blackout.watchkitapp", "Blackout Watch App Store GHA", "IOS"),
          ]
          DIST_TYPES = {"IOS_DISTRIBUTION", "DISTRIBUTION"}

          key = os.environ["APP_STORE_CONNECT_API_KEY"].replace("\r\n", "\n").strip() + "\n"
          kid = os.environ["APP_STORE_CONNECT_KEY_ID"].strip()
          iss = os.environ["APP_STORE_CONNECT_ISSUER_ID"].strip()
          team = os.environ["APPLE_TEAM_ID"].strip()
          tmp = Path(os.environ["RUNNER_TEMP"])
          home = Path.home()

          def token():
              now = int(time.time())
              t = jwt.encode(
                  {"iss": iss, "iat": now, "exp": now + 15 * 60, "aud": "appstoreconnect-v1"},
                  key,
                  algorithm="ES256",
                  headers={"kid": kid, "typ": "JWT"},
              )
              return t.decode() if isinstance(t, bytes) else t

          def api(method, url, body=None):
              data = None if body is None else json.dumps(body).encode()
              req = urllib.request.Request(
                  url,
                  data=data,
                  method=method,
                  headers={
                      "Authorization": f"Bearer {token()}",
                      "Content-Type": "application/json",
                      "Accept": "application/json",
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=60) as resp:
                      raw = resp.read()
                      return resp.status, json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:
                  raw = e.read().decode("utf-8", "replace")
                  try:
                      parsed = json.loads(raw)
                  except Exception:
                      parsed = {"raw": raw[:1200]}
                  return e.code, parsed

          def die_admin(st, payload):
              print(f"ASC HTTP {st}")
              print(json.dumps(payload)[:800])
              print(STOP)
              raise SystemExit(1)

          st, payload = api("GET", "https://api.appstoreconnect.apple.com/v1/certificates?limit=200")
          if st in (401, 403):
              die_admin(st, payload)
          if st != 200:
              print(f"ASC certificates list HTTP {st}")
              print(json.dumps(payload)[:800])
              raise SystemExit(1)
          certs = payload.get("data") or []
          counts = {}
          dist = []
          for c in certs:
              a = c.get("attributes") or {}
              t = str(a.get("certificateType") or "")
              counts[t] = counts.get(t, 0) + 1
              print(f"CERT type={t} id={c.get('id')} name={a.get('name')} exp={a.get('expirationDate')}")
              if t in DIST_TYPES:
                  dist.append(c)
          print(f"ASC certificate type counts {json.dumps(counts, sort_keys=True)}")
          print(f"ASC distribution-class certificates n={len(dist)}")

          KEEP_DIST_IDS = {"45YLWHL6UP"}
          for c in dist:
              cid = c.get("id")
              name = str((c.get("attributes") or {}).get("name") or "")
              if cid in KEEP_DIST_IDS:
                  print(f"KEEP existing distribution cert id={cid} name={name}")
                  continue
              st, payload = api("DELETE", f"https://api.appstoreconnect.apple.com/v1/certificates/{cid}")
              print(f"REVOKE orphan distribution cert id={cid} name={name} HTTP {st}")
              if st in (401, 403):
                  die_admin(st, payload)

          openssl = ["/usr/bin/openssl"]
          key_path = tmp / "dist.key"
          csr_path = tmp / "dist.csr"
          subprocess.check_call(openssl + ["genrsa", "-out", str(key_path), "2048"], stdout=subprocess.DEVNULL)
          subprocess.check_call(
              openssl
              + [
                  "req",
                  "-new",
                  "-key",
                  str(key_path),
                  "-out",
                  str(csr_path),
                  "-subj",
                  "/CN=Blackout GHA Distribution/C=US",
              ]
          )
          csr = csr_path.read_text()
          created = None
          last = None
          for ctype in ("IOS_DISTRIBUTION", "DISTRIBUTION"):
              st, payload = api(
                  "POST",
                  "https://api.appstoreconnect.apple.com/v1/certificates",
                  {
                      "data": {
                          "type": "certificates",
                          "attributes": {"certificateType": ctype, "csrContent": csr},
                      }
                  },
              )
              last = (ctype, st, payload)
              if st in (401, 403):
                  die_admin(st, payload)
              if st in (200, 201):
                  created = payload.get("data") or {}
                  print(f"CREATED certificate type={ctype} id={created.get('id')}")
                  break
              print(f"CREATE {ctype} HTTP {st} {json.dumps(payload)[:500]}")
          if created is None:
              print("No new distribution certificate. Cannot codesign on this runner without the private key of an existing cert.")
              print("Archive will still be attempted with AuthKey automatic signing + Apple Distribution identity.")
              Path(os.environ["GITHUB_ENV"]).open("a").write("HAS_LOCAL_DIST_KEY=0\n")
          else:
              der_b64 = ((created.get("attributes") or {}).get("certificateContent") or "")
              if not der_b64:
                  print("Create returned no certificateContent")
                  raise SystemExit(1)
              cer_path = tmp / "dist.cer"
              pem_path = tmp / "dist.pem"
              p12_path = tmp / "dist.p12"
              cer_path.write_bytes(__import__("base64").b64decode(der_b64))
              subprocess.check_call(openssl + ["x509", "-inform", "DER", "-in", str(cer_path), "-out", str(pem_path)])
              p12_pass = "gha-dist-" + os.urandom(8).hex()
              cert_id = created.get("id")

              def revoke_created():
                  st, payload = api("DELETE", f"https://api.appstoreconnect.apple.com/v1/certificates/{cert_id}")
                  print(f"REVOKE created cert id={cert_id} after import fail HTTP {st}")

              def export_p12(cmd):
                  if p12_path.exists():
                      p12_path.unlink()
                  subprocess.check_call(cmd)

              p12_cmds = [
                  openssl + ["pkcs12", "-export", "-inkey", str(key_path), "-in", str(pem_path), "-out", str(p12_path), "-passout", f"pass:{p12_pass}", "-name", "Blackout GHA Distribution"],
                  openssl + ["pkcs12", "-export", "-legacy", "-inkey", str(key_path), "-in", str(pem_path), "-out", str(p12_path), "-passout", f"pass:{p12_pass}", "-name", "Blackout GHA Distribution"],
                  openssl + ["pkcs12", "-export", "-keypbe", "PBE-SHA1-3DES", "-certpbe", "PBE-SHA1-3DES", "-macalg", "sha1", "-inkey", str(key_path), "-in", str(pem_path), "-out", str(p12_path), "-passout", f"pass:{p12_pass}", "-name", "Blackout GHA Distribution"],
              ]
              exported = False
              for cmd in p12_cmds:
                  try:
                      export_p12(cmd)
                      exported = True
                      print("P12 export ok", cmd[1:4])
                      break
                  except subprocess.CalledProcessError as e:
                      print("P12 export failed", e)
              if not exported:
                  revoke_created()
                  raise SystemExit("p12 export failed")
              kc = tmp / "signing.keychain-db"
              kc_pass = "gha-kc-" + os.urandom(8).hex()
              subprocess.check_call(["security", "create-keychain", "-p", kc_pass, str(kc)])
              subprocess.check_call(["security", "set-keychain-settings", "-lut", "21600", str(kc)])
              subprocess.check_call(["security", "unlock-keychain", "-p", kc_pass, str(kc)])
              existing = subprocess.check_output(["security", "list-keychains", "-d", "user"]).decode()
              paths = [str(kc)] + [ln.strip().strip('"') for ln in existing.splitlines() if ln.strip()]
              subprocess.check_call(["security", "list-keychains", "-d", "user", "-s", *paths])
              try:
                  subprocess.check_call(
                      [
                          "security",
                          "import",
                          str(p12_path),
                          "-k",
                          str(kc),
                          "-P",
                          p12_pass,
                          "-A",
                          "-T",
                          "/usr/bin/codesign",
                          "-T",
                          "/usr/bin/security",
                          "-T",
                          "/usr/bin/xcodebuild",
                      ]
                  )
              except subprocess.CalledProcessError:
                  print("p12 import failed; trying cert+key PEM")
                  try:
                      subprocess.check_call(["security", "import", str(cer_path), "-k", str(kc), "-A"])
                      subprocess.check_call(["security", "import", str(key_path), "-k", str(kc), "-A"])
                  except subprocess.CalledProcessError:
                      revoke_created()
                      raise SystemExit("keychain import failed")
              subprocess.check_call(
                  [
                      "security",
                      "set-key-partition-list",
                      "-S",
                      "apple-tool:,apple:,codesign:",
                      "-s",
                      "-k",
                      kc_pass,
                      str(kc),
                  ]
              )
              print(f"IMPORTED distribution cert id={cert_id} into runner keychain (temporary; not a human p12 secret)")
              env_path = Path(os.environ["GITHUB_ENV"])
              with env_path.open("a") as fh:
                  fh.write("HAS_LOCAL_DIST_KEY=1\n")
                  fh.write(f"DIST_CERT_ID={cert_id}\n")
                  fh.write(f"SIGNING_KEYCHAIN={kc}\n")

              def ensure_bundle(ident, platform):
                  q = urllib.parse.urlencode({"filter[identifier]": ident, "limit": "5"})
                  st, payload = api("GET", "https://api.appstoreconnect.apple.com/v1/bundleIds?" + q)
                  if st in (401, 403):
                      die_admin(st, payload)
                  if st != 200:
                      print(f"bundleId list {ident} HTTP {st}")
                      raise SystemExit(1)
                  for b in payload.get("data") or []:
                      if (b.get("attributes") or {}).get("identifier") == ident:
                          print(f"BUNDLE reuse {ident} id={b.get('id')}")
                          return b["id"]
                  st, payload = api(
                      "POST",
                      "https://api.appstoreconnect.apple.com/v1/bundleIds",
                      {
                          "data": {
                              "type": "bundleIds",
                              "attributes": {
                                  "identifier": ident,
                                  "name": ident.replace(".", " ")[:30],
                                  "platform": platform,
                              },
                          }
                      },
                  )
                  if st in (401, 403):
                      die_admin(st, payload)
                  if st not in (200, 201):
                      print(f"bundleId create {ident} HTTP {st} {json.dumps(payload)[:500]}")
                      raise SystemExit(1)
                  bid = (payload.get("data") or {}).get("id")
                  print(f"BUNDLE created {ident} id={bid}")
                  return bid

              def write_profile(uuid, content_b64):
                  blob = __import__("base64").b64decode(content_b64)
                  dirs = [
                      home / "Library/Developer/Xcode/UserData/Provisioning Profiles",
                      home / "Library/MobileDevice/Provisioning Profiles",
                  ]
                  for d in dirs:
                      d.mkdir(parents=True, exist_ok=True)
                      (d / f"{uuid}.mobileprovision").write_bytes(blob)
                  print(f"PROFILE wrote {uuid} bytes={len(blob)}")

              profile_names = {}
              for ident, pname, platform in BUNDLES:
                  bid = ensure_bundle(ident, platform)
                  q = urllib.parse.urlencode({"filter[profileType]": "IOS_APP_STORE", "limit": "200"})
                  st, payload = api("GET", "https://api.appstoreconnect.apple.com/v1/profiles?" + q)
                  if st in (401, 403):
                      die_admin(st, payload)
                  match = None
                  for p in payload.get("data") or []:
                      a = p.get("attributes") or {}
                      if a.get("name") == pname or a.get("profileState") == "ACTIVE":
                          # confirm bundle via related? skip name match first
                          if a.get("name") == pname:
                              match = p
                              break
                  if match is None:
                      st, payload = api(
                          "POST",
                          "https://api.appstoreconnect.apple.com/v1/profiles",
                          {
                              "data": {
                                  "type": "profiles",
                                  "attributes": {"name": pname, "profileType": "IOS_APP_STORE"},
                                  "relationships": {
                                      "bundleId": {"data": {"type": "bundleIds", "id": bid}},
                                      "certificates": {
                                          "data": [{"type": "certificates", "id": cert_id}]
                                      },
                                  },
                              }
                          },
                      )
                      if st in (401, 403):
                          die_admin(st, payload)
                      if st not in (200, 201):
                          print(f"profile create {ident} HTTP {st} {json.dumps(payload)[:700]}")
                          raise SystemExit(1)
                      match = payload.get("data") or {}
                      print(f"PROFILE created {pname} id={match.get('id')}")
                  else:
                      print(f"PROFILE reuse {pname} id={match.get('id')}")
                      st, payload = api(
                          "GET",
                          f"https://api.appstoreconnect.apple.com/v1/profiles/{match['id']}",
                      )
                      if st != 200:
                          print(f"profile get {pname} HTTP {st}")
                          raise SystemExit(1)
                      match = payload.get("data") or {}
                  attrs = match.get("attributes") or {}
                  uuid = attrs.get("uuid") or match.get("id")
                  content = attrs.get("profileContent")
                  if not content:
                      print(f"profile {pname} missing profileContent")
                      raise SystemExit(1)
                  write_profile(uuid, content)
                  profile_names[ident] = pname
              Path(os.environ["RUNNER_TEMP"], "profile_map.json").write_text(json.dumps(profile_names))
              print("wrote profile_map.json", profile_names)
          PY

      - name: Next CFBundleVersion from ASC
        id: ver
        run: |
          set -euo pipefail
          "$PYBIN" << 'PY'
          import json, os, time, urllib.parse, urllib.request
          import jwt

          key = os.environ["APP_STORE_CONNECT_API_KEY"].replace("\r\n", "\n").strip() + "\n"
          kid = os.environ["APP_STORE_CONNECT_KEY_ID"].strip()
          iss = os.environ["APP_STORE_CONNECT_ISSUER_ID"].strip()
          app = os.environ["ASC_APP_ID"]
          now = int(time.time())
          tok = jwt.encode(
              {"iss": iss, "iat": now, "exp": now + 15 * 60, "aud": "appstoreconnect-v1"},
              key,
              algorithm="ES256",
              headers={"kid": kid, "typ": "JWT"},
          )
          if isinstance(tok, bytes):
              tok = tok.decode()
          q = urllib.parse.urlencode({"filter[app]": app, "limit": "50", "sort": "-version"})
          req = urllib.request.Request(
              "https://api.appstoreconnect.apple.com/v1/builds?" + q,
              headers={"Authorization": f"Bearer {tok}", "Accept": "application/json"},
          )
          with urllib.request.urlopen(req, timeout=45) as resp:
              data = json.loads(resp.read())
          nums = []
          for b in data.get("data") or []:
              v = str((b.get("attributes") or {}).get("version") or "")
              if v.isdigit():
                  nums.append(int(v))
          nxt = (max(nums) + 1) if nums else 1
          print(f"ASC existing CFBundleVersion max={max(nums) if nums else 'none'} next={nxt}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"next={nxt}\n")
          PY

      - name: Archive and export App Store IPA
        run: |
          set -euo pipefail
          NEXT="${{ steps.ver.outputs.next }}"
          if [ -z "$NEXT" ]; then
            echo "No next CFBundleVersion. No archive."
            exit 1
          fi
          echo "CURRENT_PROJECT_VERSION on the command line only: $NEXT (not committed)"
          ARCHIVE="$RUNNER_TEMP/Blackout.xcarchive"
          EXPORT="$RUNNER_TEMP/export"
          STOP='ASC API key cannot create or reuse signing certificates. In App Store Connect → Users and Access → Integrations → App Store Connect API, the key’s role must be Admin or Account Holder (not Developer, not App Manager). Account Holder/Admin: edit or replace APP_STORE_CONNECT_API_KEY with an Admin key.'
          AUTH=(
            -allowProvisioningUpdates
            -authenticationKeyPath "$AUTH_KEY_PATH"
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID"
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"
          )
          "$PYBIN" - << PY
          import json, os, plistlib
          from pathlib import Path
          path = os.environ["RUNNER_TEMP"] + "/ExportOptions.plist"
          profiles = {}
          pmap = Path(os.environ["RUNNER_TEMP"]) / "profile_map.json"
          if pmap.exists():
              profiles = json.loads(pmap.read_text())
          body = {
              "method": "app-store-connect",
              "destination": "export",
              "teamID": os.environ["APPLE_TEAM_ID"],
              "uploadSymbols": True,
              "manageAppVersionAndBuildNumber": False,
          }
          if profiles and os.environ.get("HAS_LOCAL_DIST_KEY") == "1":
              body["signingStyle"] = "manual"
              body["signingCertificate"] = "Apple Distribution"
              body["provisioningProfiles"] = profiles
          else:
              body["signingStyle"] = "automatic"
          plistlib.dump(body, open(path, "wb"))
          print("wrote", path, "signingStyle", body["signingStyle"])
          PY
          strip_watch() {
            echo "CI-only: strip Embed Watch Content from checkout (not committed) after Watch profile packaging fail"
            "$PYBIN" - << 'PY'
          from pathlib import Path
          p = Path("Blackout.xcodeproj/project.pbxproj")
          text = p.read_text()
          old = text
          text = text.replace("BlackoutWatch.app in Embed Watch Content", "BlackoutWatch.app in Embed Watch Content DISABLED")
          # drop the embed phase file from the resources build phase by commenting the id usage is brittle;
          # instead remove the Embed Watch Content PBXCopyFilesBuildPhase block if present.
          lines = text.splitlines(True)
          out = []
          skip = 0
          i = 0
          while i < len(lines):
              line = lines[i]
              if "Embed Watch Content" in line and "isa = PBXCopyFilesBuildPhase" in "".join(lines[i:i+8]):
                  # walk back to the id = { start
                  pass
              out.append(line)
              i += 1
          # simpler: delete lines that reference the watch embed build file in the main target
          text = old
          text = text.replace("\t\t\t\t61FBFF9043DC2352CAEDC813 /* BlackoutWatch.app in Embed Watch Content */,\n", "")
          if text == old:
              print("Watch embed line not found; pbxproj may have changed")
          else:
              p.write_text(text)
              print("Removed Embed Watch Content build file from iOS target (working copy only)")
          PY
          }
          archive_once() {
            set +e
            xcodebuild \
              -project Blackout.xcodeproj \
              -scheme Blackout \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              -archivePath "$ARCHIVE" \
              CURRENT_PROJECT_VERSION="$NEXT" \
              DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
              CODE_SIGN_STYLE=Automatic \
              CODE_SIGN_IDENTITY="Apple Distribution" \
              CODE_SIGNING_ALLOWED=YES \
              CODE_SIGNING_REQUIRED=YES \
              "${AUTH[@]}" \
              archive 2>&1 | tee "$RUNNER_TEMP/archive.log"
            echo "${PIPESTATUS[0]}" > "$RUNNER_TEMP/archive.exit"
            set -e
          }
          archive_once
          ARC="$(cat "$RUNNER_TEMP/archive.exit")"
          if [ "$ARC" -ne 0 ] && grep -q "BlackoutWatch" "$RUNNER_TEMP/archive.log" && grep -qi "mobileprovision" "$RUNNER_TEMP/archive.log"; then
            strip_watch
            rm -rf "$ARCHIVE"
            archive_once
            ARC="$(cat "$RUNNER_TEMP/archive.exit")"
          fi
          if [ "$ARC" -ne 0 ]; then
            if grep -qiE 'HTTP 401|HTTP 403|not have permission|Unable to log in|403 Forbidden|401 Unauthorized' "$RUNNER_TEMP/archive.log"; then
              echo "$STOP"
            fi
            echo "Archive failed. No upload."
            exit 1
          fi
          mkdir -p "$EXPORT"
          set +e
          xcodebuild \
            -exportArchive \
            -archivePath "$ARCHIVE" \
            -exportPath "$EXPORT" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            "${AUTH[@]}" \
            2>&1 | tee "$RUNNER_TEMP/export.log"
          EXP=${PIPESTATUS[0]}
          set -e
          if [ "$EXP" -ne 0 ]; then
            if grep -qiE 'HTTP 401|HTTP 403|not have permission|Unable to log in|403 Forbidden|401 Unauthorized' "$RUNNER_TEMP/export.log"; then
              echo "$STOP"
            fi
            echo "Export failed. No upload."
            exit 1
          fi
          ls -la "$EXPORT"
          IPA="$(ls "$EXPORT"/*.ipa | head -n 1)"
          echo "IPA=$IPA" >> "$GITHUB_ENV"
          echo "NEXT_BUILD=$NEXT" >> "$GITHUB_ENV"

      - name: Upload IPA with AuthKey (no App Review)
        run: |
          set -euo pipefail
          if [ -z "${IPA:-}" ] || [ ! -f "$IPA" ]; then
            echo "No IPA. No upload."
            exit 1
          fi
          STOP='ASC API key cannot create or reuse signing certificates. In App Store Connect → Users and Access → Integrations → App Store Connect API, the key’s role must be Admin or Account Holder (not Developer, not App Manager). Account Holder/Admin: edit or replace APP_STORE_CONNECT_API_KEY with an Admin key.'
          set +e
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA" \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID" \
            2>&1 | tee "$RUNNER_TEMP/altool.log"
          UP=${PIPESTATUS[0]}
          set -e
          if [ "$UP" -ne 0 ]; then
            if grep -qiE 'HTTP 401|HTTP 403|not have permission|Unable to log in|403 Forbidden|401 Unauthorized' "$RUNNER_TEMP/altool.log"; then
              echo "$STOP"
            fi
            echo "Upload failed. Not faked."
            exit 1
          fi
          echo "Uploaded CFBundleVersion ${NEXT_BUILD}. Not submitted for App Review. No External Testing group."

      - name: Assign existing Internal group after VALID
        run: |
          set -euo pipefail
          WANT_BUILD="${NEXT_BUILD}" "$PYBIN" << 'PY'
          import json, os, time, urllib.error, urllib.parse, urllib.request
          import jwt

          key = os.environ["APP_STORE_CONNECT_API_KEY"].replace("\r\n", "\n").strip() + "\n"
          kid = os.environ["APP_STORE_CONNECT_KEY_ID"].strip()
          iss = os.environ["APP_STORE_CONNECT_ISSUER_ID"].strip()
          app = os.environ["ASC_APP_ID"]
          group = os.environ["ASC_INTERNAL_GROUP_ID"]
          want = (os.environ.get("WANT_BUILD") or "").strip()

          def token():
              now = int(time.time())
              t = jwt.encode(
                  {"iss": iss, "iat": now, "exp": now + 15 * 60, "aud": "appstoreconnect-v1"},
                  key,
                  algorithm="ES256",
                  headers={"kid": kid, "typ": "JWT"},
              )
              return t.decode() if isinstance(t, bytes) else t

          def req(method, url, body=None, tok=None):
              data = None if body is None else json.dumps(body).encode()
              r = urllib.request.Request(
                  url,
                  data=data,
                  method=method,
                  headers={
                      "Authorization": f"Bearer {tok or token()}",
                      "Content-Type": "application/json",
                      "Accept": "application/json",
                  },
              )
              try:
                  with urllib.request.urlopen(r, timeout=45) as resp:
                      raw = resp.read()
                      return resp.status, json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:
                  raw = e.read().decode()
                  try:
                      parsed = json.loads(raw)
                  except Exception:
                      parsed = {"raw": raw[:800]}
                  return e.code, parsed

          deadline = time.time() + 25 * 60
          last_tok = None
          last_tok_at = 0
          target = None
          while time.time() < deadline:
              if last_tok is None or time.time() - last_tok_at > 10 * 60:
                  last_tok = token()
                  last_tok_at = time.time()
              q = urllib.parse.urlencode({"filter[app]": app, "limit": "20", "sort": "-uploadedDate"})
              st, data = req("GET", "https://api.appstoreconnect.apple.com/v1/builds?" + q, tok=last_tok)
              if st != 200:
                  raise SystemExit(f"list {st} {data}")
              match = None
              for b in data.get("data") or []:
                  a = b.get("attributes") or {}
                  if str(a.get("version")) == want:
                      match = {"id": b["id"], "version": str(a.get("version")), "processingState": a.get("processingState"), "usesNonExemptEncryption": a.get("usesNonExemptEncryption")}
                      break
              if not match:
                  print("WAIT no build", want)
                  time.sleep(30)
                  continue
              target = match
              print("BUILD", json.dumps(target))
              if target["processingState"] in ("FAILED", "INVALID"):
                  raise SystemExit(2)
              if target["processingState"] != "VALID":
                  print("WAIT", target["processingState"])
                  time.sleep(30)
                  continue
              bid = target["id"]
              if target.get("usesNonExemptEncryption") is None:
                  st, data = req(
                      "PATCH",
                      f"https://api.appstoreconnect.apple.com/v1/builds/{bid}",
                      {"data": {"type": "builds", "id": bid, "attributes": {"usesNonExemptEncryption": False}}},
                      tok=last_tok,
                  )
                  print("PATCH", target["version"], st)
              st, data = req(
                  "POST",
                  f"https://api.appstoreconnect.apple.com/v1/betaGroups/{group}/relationships/builds",
                  {"data": [{"type": "builds", "id": bid}]},
                  tok=last_tok,
              )
              print("ASSIGN Internal", target["version"], st)
              if st >= 400 and st != 409:
                  print(json.dumps(data)[:500])
                  raise SystemExit(1)
              raise SystemExit(0)
          print("TIMEOUT", json.dumps(target))
          raise SystemExit(1)
          PY
