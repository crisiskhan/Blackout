name: TestFlight Internal

on:
  workflow_dispatch:

jobs:
  upload:
    name: Signed archive + Internal upload
    runs-on: macos-14
    timeout-minutes: 90
    env:
      APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
      P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
      BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
      WATCH_PROVISION_PROFILE_BASE64: ${{ secrets.WATCH_PROVISION_PROFILE_BASE64 }}
      WIDGETS_PROVISION_PROFILE_BASE64: ${{ secrets.WIDGETS_PROVISION_PROFILE_BASE64 }}
      ASC_APP_ID: "6806388963"
      ASC_INTERNAL_GROUP_ID: "28035586-fce6-474f-9bc2-ef0f1f65306e"
    steps:
      - name: Require signing secrets
        run: |
          set -euo pipefail
          missing=0
          for name in \
            BUILD_CERTIFICATE_BASE64 \
            P12_PASSWORD \
            BUILD_PROVISION_PROFILE_BASE64 \
            WATCH_PROVISION_PROFILE_BASE64 \
            WIDGETS_PROVISION_PROFILE_BASE64
          do
            eval "val=\${$name:-}"
            if [ -z "$val" ]; then
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "MISSING and must exist as repo Actions secrets:"
            echo "- BUILD_CERTIFICATE_BASE64 — Apple Distribution certificate exported as .p12, base64"
            echo "- P12_PASSWORD — password for that p12"
            echo "- BUILD_PROVISION_PROFILE_BASE64 — App Store profile for com.crisiskhan.blackout"
            echo "- WATCH_PROVISION_PROFILE_BASE64 — App Store profile for com.crisiskhan.blackout.watchkitapp (embedded Watch)"
            echo "- WIDGETS_PROVISION_PROFILE_BASE64 — App Store profile for com.crisiskhan.blackout.widgets (embedded widgets)"
            echo "No archive. No upload. CURRENT_PROJECT_VERSION not bumped."
            exit 1
          fi
          for name in APP_STORE_CONNECT_API_KEY APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_KEY_ID APPLE_TEAM_ID
          do
            eval "val=\${$name:-}"
            if [ -z "$val" ]; then
              echo "Required secret $name is empty. No archive. No upload."
              exit 1
            fi
          done
          echo "Signing and ASC secrets are present (values not printed)."

      - uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          set -euo pipefail
          ls /Applications | grep -i xcode || true
          xcodebuild -version || true
          for app in \
            /Applications/Xcode_16.4.app \
            /Applications/Xcode_16.3.app \
            /Applications/Xcode_16.2.app \
            /Applications/Xcode_16.1.app \
            /Applications/Xcode_16.0.app \
            /Applications/Xcode_16.app \
            /Applications/Xcode.app
          do
            if [ -d "$app" ]; then
              sudo xcode-select -s "$app"
              break
            fi
          done
          xcodebuild -version
          xcode-select -p

      - name: Import Distribution cert and App Store profiles
        run: |
          set -euo pipefail
          CERT="$RUNNER_TEMP/dist.p12"
          KEYCHAIN="$RUNNER_TEMP/blackout-signing.keychain-db"
          KEYCHAIN_PW="$(openssl rand -base64 24)"
          printf '%s' "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERT"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security import "$CERT" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PW" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN" login.keychain
          PROFILES="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES"
          printf '%s' "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode > "$PROFILES/blackout-app.mobileprovision"
          printf '%s' "$WATCH_PROVISION_PROFILE_BASE64" | base64 --decode > "$PROFILES/blackout-watch.mobileprovision"
          printf '%s' "$WIDGETS_PROVISION_PROFILE_BASE64" | base64 --decode > "$PROFILES/blackout-widgets.mobileprovision"
          echo "Imported certificate and three App Store profiles (names not assumed)."

      - name: Next CFBundleVersion from ASC
        id: ver
        run: |
          set -euo pipefail
          python3 -m pip install -q PyJWT cryptography
          python3 << 'PY'
          import json, os, time, urllib.parse, urllib.request
          import jwt

          key = os.environ["APP_STORE_CONNECT_API_KEY"].replace("\r\n", "\n").strip() + "\n"
          kid = os.environ["APP_STORE_CONNECT_KEY_ID"].strip()
          iss = os.environ["APP_STORE_CONNECT_ISSUER_ID"].strip()
          app = os.environ["ASC_APP_ID"]
          now = int(time.time())
          tok = jwt.encode(
              {"iss": iss, "iat": now, "exp": now + 15 * 60, "aud": "appstoreconnect-v1"},
              key,
              algorithm="ES256",
              headers={"kid": kid, "typ": "JWT"},
          )
          if isinstance(tok, bytes):
              tok = tok.decode()
          q = urllib.parse.urlencode({"filter[app]": app, "limit": "50", "sort": "-version"})
          req = urllib.request.Request(
              "https://api.appstoreconnect.apple.com/v1/builds?" + q,
              headers={"Authorization": f"Bearer {tok}", "Accept": "application/json"},
          )
          with urllib.request.urlopen(req, timeout=45) as resp:
              data = json.loads(resp.read())
          nums = []
          for b in data.get("data") or []:
              v = str((b.get("attributes") or {}).get("version") or "")
              if v.isdigit():
                  nums.append(int(v))
          nxt = (max(nums) + 1) if nums else 1
          print(f"ASC existing CFBundleVersion max={max(nums) if nums else 'none'} next={nxt}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"next={nxt}\n")
          PY

      - name: Archive and export App Store IPA
        run: |
          set -euo pipefail
          NEXT="${{ steps.ver.outputs.next }}"
          if [ -z "$NEXT" ]; then
            echo "No next CFBundleVersion. No archive."
            exit 1
          fi
          echo "CURRENT_PROJECT_VERSION on the command line only: $NEXT (not committed)"
          ARCHIVE="$RUNNER_TEMP/Blackout.xcarchive"
          EXPORT="$RUNNER_TEMP/export"
          PROFILES="$HOME/Library/MobileDevice/Provisioning Profiles"
          name_of() {
            security cms -D -i "$1" | plutil -extract Name raw -
          }
          APP_PN="$(name_of "$PROFILES/blackout-app.mobileprovision")"
          WATCH_PN="$(name_of "$PROFILES/blackout-watch.mobileprovision")"
          WIDGET_PN="$(name_of "$PROFILES/blackout-widgets.mobileprovision")"
          cat > "$RUNNER_TEMP/ExportOptions.plist" << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>export</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.crisiskhan.blackout</key>
              <string>${APP_PN}</string>
              <key>com.crisiskhan.blackout.watchkitapp</key>
              <string>${WATCH_PN}</string>
              <key>com.crisiskhan.blackout.widgets</key>
              <string>${WIDGET_PN}</string>
            </dict>
          </dict>
          </plist>
          EOF
          xcodebuild \
            -project Blackout.xcodeproj \
            -scheme Blackout \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE" \
            CURRENT_PROJECT_VERSION="$NEXT" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            archive
          mkdir -p "$EXPORT"
          xcodebuild \
            -exportArchive \
            -archivePath "$ARCHIVE" \
            -exportPath "$EXPORT" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
          ls -la "$EXPORT"
          IPA="$(ls "$EXPORT"/*.ipa | head -n 1)"
          echo "IPA=$IPA" >> "$GITHUB_ENV"
          echo "NEXT_BUILD=$NEXT" >> "$GITHUB_ENV"

      - name: Upload IPA with AuthKey (no App Review)
        run: |
          set -euo pipefail
          if [ -z "${IPA:-}" ] || [ ! -f "$IPA" ]; then
            echo "No IPA. No upload."
            exit 1
          fi
          KEYDIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$KEYDIR"
          KEYFILE="$KEYDIR/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          printf '%s\n' "$(printf '%s' "$APP_STORE_CONNECT_API_KEY" | tr -d '\r')" > "$KEYFILE"
          chmod 600 "$KEYFILE"
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA" \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
          echo "Uploaded CFBundleVersion ${NEXT_BUILD}. Not submitted for App Review. No External Testing group."

      - name: Assign existing Internal group after VALID
        run: |
          set -euo pipefail
          python3 -m pip install -q PyJWT cryptography
          WANT_BUILD="${NEXT_BUILD}" python3 << 'PY'
          import json, os, time, urllib.error, urllib.parse, urllib.request
          import jwt

          key = os.environ["APP_STORE_CONNECT_API_KEY"].replace("\r\n", "\n").strip() + "\n"
          kid = os.environ["APP_STORE_CONNECT_KEY_ID"].strip()
          iss = os.environ["APP_STORE_CONNECT_ISSUER_ID"].strip()
          app = os.environ["ASC_APP_ID"]
          group = os.environ["ASC_INTERNAL_GROUP_ID"]
          want = (os.environ.get("WANT_BUILD") or "").strip()

          def token():
              now = int(time.time())
              t = jwt.encode(
                  {"iss": iss, "iat": now, "exp": now + 15 * 60, "aud": "appstoreconnect-v1"},
                  key,
                  algorithm="ES256",
                  headers={"kid": kid, "typ": "JWT"},
              )
              return t.decode() if isinstance(t, bytes) else t

          def req(method, url, body=None, tok=None):
              data = None if body is None else json.dumps(body).encode()
              r = urllib.request.Request(
                  url,
                  data=data,
                  method=method,
                  headers={
                      "Authorization": f"Bearer {tok or token()}",
                      "Content-Type": "application/json",
                      "Accept": "application/json",
                  },
              )
              try:
                  with urllib.request.urlopen(r, timeout=45) as resp:
                      raw = resp.read()
                      return resp.status, json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:
                  raw = e.read().decode()
                  try:
                      parsed = json.loads(raw)
                  except Exception:
                      parsed = {"raw": raw[:800]}
                  return e.code, parsed

          deadline = time.time() + 25 * 60
          last_tok = None
          last_tok_at = 0
          target = None
          while time.time() < deadline:
              if last_tok is None or time.time() - last_tok_at > 10 * 60:
                  last_tok = token()
                  last_tok_at = time.time()
              q = urllib.parse.urlencode({"filter[app]": app, "limit": "20", "sort": "-uploadedDate"})
              st, data = req("GET", "https://api.appstoreconnect.apple.com/v1/builds?" + q, tok=last_tok)
              if st != 200:
                  raise SystemExit(f"list {st} {data}")
              match = None
              for b in data.get("data") or []:
                  a = b.get("attributes") or {}
                  if str(a.get("version")) == want:
                      match = {"id": b["id"], "version": str(a.get("version")), "processingState": a.get("processingState"), "usesNonExemptEncryption": a.get("usesNonExemptEncryption")}
                      break
              if not match:
                  print("WAIT no build", want)
                  time.sleep(30)
                  continue
              target = match
              print("BUILD", json.dumps(target))
              if target["processingState"] in ("FAILED", "INVALID"):
                  raise SystemExit(2)
              if target["processingState"] != "VALID":
                  print("WAIT", target["processingState"])
                  time.sleep(30)
                  continue
              bid = target["id"]
              if target.get("usesNonExemptEncryption") is None:
                  st, data = req(
                      "PATCH",
                      f"https://api.appstoreconnect.apple.com/v1/builds/{bid}",
                      {"data": {"type": "builds", "id": bid, "attributes": {"usesNonExemptEncryption": False}}},
                      tok=last_tok,
                  )
                  print("PATCH", target["version"], st)
              st, data = req(
                  "POST",
                  f"https://api.appstoreconnect.apple.com/v1/betaGroups/{group}/relationships/builds",
                  {"data": [{"type": "builds", "id": bid}]},
                  tok=last_tok,
              )
              print("ASSIGN Internal", target["version"], st)
              if st >= 400 and st != 409:
                  print(json.dumps(data)[:500])
                  raise SystemExit(1)
              raise SystemExit(0)
          print("TIMEOUT", json.dumps(target))
          raise SystemExit(1)
          PY
