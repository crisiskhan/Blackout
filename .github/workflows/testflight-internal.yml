              "}\n"
              'strip_app "$CODESIGNING_FOLDER_PATH"\n'
              'strip_app "$BUILT_PRODUCTS_DIR/$FULL_PRODUCT_NAME"\n'
              'strip_app "$TARGET_BUILD_DIR/$FULL_PRODUCT_NAME"\n'
              'if [ -n "$BUILD_DIR" ]; then\n'
              '  find "$BUILD_DIR" -type d -path "*/InstallationBuildProductsLocation/Applications/*.app" 2>/dev/null | while read -r APP; do\n'
              "    strip_app \"$APP\"\n"
              "  done\n"
              "fi\n"
          )
          script.chmod(0o755)
          print("wrote", script.resolve())
          path = Path("Blackout.xcodeproj/project.pbxproj")
          text = path.read_text()
          phase_id = "C1A00001B007000000000001"
          note = "CI strip loose AppIcon before CodeSign"
          if phase_id in text:
              print("phase already present")
          else:
              phase = (
                  f"\t\t{phase_id} /* {note} */ = {{\n"
                  "\t\t\tisa = PBXShellScriptBuildPhase;\n"
                  "\t\t\talwaysOutOfDate = 1;\n"
                  "\t\t\tbuildActionMask = 2147483647;\n"
                  "\t\t\tfiles = (\n\t\t\t);\n"
                  "\t\t\tinputFileListPaths = (\n\t\t\t);\n"
                  "\t\t\tinputPaths = (\n\t\t\t);\n"
                  f'\t\t\tname = "{note}";\n'
                  "\t\t\toutputFileListPaths = (\n\t\t\t);\n"
                  "\t\t\toutputPaths = (\n\t\t\t);\n"
                  "\t\t\trunOnlyForDeploymentPostprocessing = 1;\n"
                  "\t\t\tshellPath = /bin/sh;\n"
                  # pbxproj: shellScript = "\"$SRCROOT/ci_strip_appicon.sh\"\n";
                  '\t\t\tshellScript = "\\"$SRCROOT/ci_strip_appicon.sh\\"\\n";\n'
                  "\t\t\tshowEnvVarsInLog = 0;\n"
                  "\t\t};\n"
              )
              marker = "/* Begin PBXShellScriptBuildPhase section */\n"
              if marker not in text:
                  raise SystemExit("PBXShellScriptBuildPhase section missing")
              text = text.replace(marker, marker + phase, 1)
              needle = "\t\t\t\t22B4790C46112DC12EE4F2A3 /* Embed Foundation Extensions */,\n"
              if needle not in text:
                  raise SystemExit("Embed Foundation Extensions missing")
              text = text.replace(needle, needle + f"\t\t\t\t{phase_id} /* {note} */,\n", 1)
              path.write_text(text)
              print("injected AppIcon cleanup phase")
          # sanity: shellScript line must contain escaped quotes
          check = path.read_text()
          if 'shellScript = "\\"$SRCROOT/ci_strip_appicon.sh\\"\\n";' not in check and 'shellScript = "\\"$SRCROOT/ci_strip_appicon.sh"\\n";' not in check:
              # print nearby for debug
              i = check.find("ci_strip_appicon")
              print("SANITY FAIL nearby:", repr(check[i-40:i+80]))
              raise SystemExit("pbxproj shellScript line malformed")
          print("pbxproj shellScript line OK")
          PY
          /usr/bin/xattr -cr . || true
          find . -name '*.png' -exec chmod a-x {} + || true
          echo "codesign identities:"
          security find-identity -v -p codesigning || true
          IDLINE=$(security find-identity -v -p codesigning "$SIGNING_KEYCHAIN" 2>/dev/null | grep -i Distribution | grep -v "CSSMERR" | head -n 1 || true)
          if [ -n "$IDLINE" ]; then
            IDHASH=$(printf '%s' "$IDLINE" | awk '{print $2}')
            IDNAME=$(printf '%s' "$IDLINE" | sed -n 's/.*"\(.*\)"/\1/p')
            echo "Using CODE_SIGN_IDENTITY hash=$IDHASH name=$IDNAME"
            "$PYBIN" - "$IDHASH" << 'PY'
          import sys
          from pathlib import Path
          name = sys.argv[1]
          p = Path("Blackout.xcodeproj/project.pbxproj")
          t = p.read_text()
          t = t.replace('CODE_SIGN_IDENTITY = "iOS Distribution";', f'CODE_SIGN_IDENTITY = "{name}";')
          p.write_text(t)
          print("rewrote CODE_SIGN_IDENTITY to exact keychain name")
          PY
          fi
          strip_watch() {
            echo "CI-only: strip Embed Watch Content from checkout (not committed) after Watch profile packaging fail"
            "$PYBIN" - << 'PY'
          from pathlib import Path
          p = Path("Blackout.xcodeproj/project.pbxproj")
          text = p.read_text()
          old = text
          text = text.replace("BlackoutWatch.app in Embed Watch Content", "BlackoutWatch.app in Embed Watch Content DISABLED")
          # drop the embed phase file from the resources build phase by commenting the id usage is brittle;
          # instead remove the Embed Watch Content PBXCopyFilesBuildPhase block if present.
          lines = text.splitlines(True)
          out = []
          skip = 0
          i = 0
          while i < len(lines):
              line = lines[i]
              if "Embed Watch Content" in line and "isa = PBXCopyFilesBuildPhase" in "".join(lines[i:i+8]):
                  # walk back to the id = { start
                  pass
              out.append(line)
              i += 1
          # simpler: delete lines that reference the watch embed build file in the main target
          text = old
          text = text.replace("\t\t\t\t61FBFF9043DC2352CAEDC813 /* BlackoutWatch.app in Embed Watch Content */,\n", "")
          if text == old:
              print("Watch embed line not found; pbxproj may have changed")
          else:
              p.write_text(text)
              print("Removed Embed Watch Content build file from iOS target (working copy only)")
          PY
          }
          DD="$RUNNER_TEMP/DerivedData"
          # Ephemeral GHA codesign wrapper (Crisis approved 2026-09-03 MT).
          # Xcode calls /usr/bin/codesign by absolute path AFTER ExtractAppIntentsMetadata
          # recreates Metadata.appintents; strip that (and loose AppIcons) then call real codesign.
          # Lives only on this runner VM for this job.
          if [ ! -f /usr/bin/codesign.real ]; then
            sudo mv /usr/bin/codesign /usr/bin/codesign.real
          fi
          # install wrapper (unindented body via second heredoc)
          sudo tee /usr/bin/codesign >/dev/null <<'WRAP'
#!/bin/bash
REAL=/usr/bin/codesign.real
for a in "$@"; do
  if [ -d "$a" ]; then
    find "$a" -type d -name 'Metadata.appintents' -print 2>/dev/null | while IFS= read -r d; do
      echo "codesign-wrap: rm $d" >&2
      rm -rf "$d"
    done
    find "$a" -maxdepth 1 -name 'AppIcon*.png' -print -delete 2>/dev/null || true
  fi
done
exec "$REAL" "$@"
WRAP
          sudo chmod 755 /usr/bin/codesign /usr/bin/codesign.real
          restore_codesign() {
            if [ -f /usr/bin/codesign.real ]; then
              sudo mv -f /usr/bin/codesign.real /usr/bin/codesign 2>/dev/null || true
            fi
          }
          trap restore_codesign EXIT
          echo "codesign wrapper installed (real=$(ls -la /usr/bin/codesign.real | awk '{print $1,$3,$4,$NF}'))"

          set +e
          rm -rf "$DD" "$ARCHIVE"
          xcodebuild \
            -project Blackout.xcodeproj \
            -scheme Blackout \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DD" \
            -archivePath "$ARCHIVE" \
            CURRENT_PROJECT_VERSION="$NEXT" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGNING_ALLOWED=YES \
            ENABLE_APP_INTENTS_METADATA_GENERATION=NO \
            "${AUTH[@]}" \
            archive 2>&1 | tee "$RUNNER_TEMP/archive.log"
          echo "${PIPESTATUS[0]}" > "$RUNNER_TEMP/archive.exit"
          set -e
          ARC="$(cat "$RUNNER_TEMP/archive.exit")"
          echo "archive exit=$ARC"

          IPA=""
          if [ "$ARC" -eq 0 ] && [ -d "$ARCHIVE/Products/Applications/Blackout.app" ]; then
            echo "Archive OK under wrapper — exportArchive"
            rm -rf "$EXPORT"
            mkdir -p "$EXPORT"
            set +e
            xcodebuild \
              -exportArchive \
              -archivePath "$ARCHIVE" \
              -exportPath "$EXPORT" \
              -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
              "${AUTH[@]}" \
              2>&1 | tee "$RUNNER_TEMP/export.log"
            EX="${PIPESTATUS[0]}"
            set -e
            if [ "$EX" -eq 0 ]; then
              IPA="$(ls "$EXPORT"/*.ipa 2>/dev/null | head -n 1 || true)"
            else
              echo "exportArchive exit=$EX — hand-zip from archive Products"
            fi
            if [ -z "$IPA" ] || [ ! -f "$IPA" ]; then
              APP="$ARCHIVE/Products/Applications/Blackout.app"
              rm -rf "$EXPORT"
              mkdir -p "$EXPORT/Payload"
              cp -a "$APP" "$EXPORT/Payload/Blackout.app"
              ( cd "$EXPORT" && zip -r -y -q Blackout.ipa Payload )
              IPA="$EXPORT/Blackout.ipa"
            fi
          else
            # Fallback: recover InstallationBuildProductsLocation, strip, re-seal main only
            APP=""
            if [ -d "$ARCHIVE/Products/Applications/Blackout.app" ]; then
              APP="$ARCHIVE/Products/Applications/Blackout.app"
            else
              APP="$(find "$DD" -type d -path '*/InstallationBuildProductsLocation/Applications/Blackout.app' 2>/dev/null | head -n 1 || true)"
            fi
            if [ -z "$APP" ] || [ ! -d "$APP" ]; then
              echo "Archive failed and no recoverable Blackout.app. No upload."
              exit 1
            fi
            echo "Recovered app at $APP (archive exit=$ARC) — fallback re-seal"
            find "$APP" -maxdepth 1 -name 'AppIcon*.png' -print -delete || true
            find "$APP" -type d -name 'Metadata.appintents' -print -exec rm -rf {} + 2>/dev/null || true
            rm -rf "$APP/_CodeSignature" 2>/dev/null || true
            /usr/bin/xattr -cr "$APP" || true
            IDLINE=$(security find-identity -v -p codesigning "${SIGNING_KEYCHAIN:-}" 2>/dev/null | grep -i Distribution | grep -v CSSMERR | head -n 1 || true)
            if [ -z "$IDLINE" ]; then
              IDLINE=$(security find-identity -v -p codesigning | grep -i Distribution | grep -v CSSMERR | head -n 1 || true)
            fi
            IDHASH=$(printf '%s' "$IDLINE" | awk '{print $2}')
            if [ -z "$IDHASH" ]; then
              echo "No Distribution identity"
              exit 1
            fi
            echo "Re-seal main app with $IDHASH"
            "$PYBIN" - "$APP" << 'PY'
          import os, subprocess, plistlib, sys
          from pathlib import Path
          app = Path(sys.argv[1])
          prov = app / "embedded.mobileprovision"
          if not prov.exists():
              home = Path.home()
              for d in (
                  home / "Library/Developer/Xcode/UserData/Provisioning Profiles",
                  home / "Library/MobileDevice/Provisioning Profiles",
              ):
                  if not d.exists():
                      continue
                  for p in d.glob("*.mobileprovision"):
                      try:
                          raw = subprocess.check_output(["security", "cms", "-D", "-i", str(p)], stderr=subprocess.DEVNULL)
                          pl = plistlib.loads(raw)
                      except Exception:
                          continue
                      ents = pl.get("Entitlements") or {}
                      appid = ents.get("application-identifier") or ""
                      bid = appid.split(".", 1)[-1] if "." in appid else ""
                      if bid == "com.crisiskhan.blackout":
                          prov.write_bytes(p.read_bytes())
                          print(f"embedded profile from {p.name}")
                          break
          if not prov.exists():
              print("WARNING: no embedded.mobileprovision on app")
              raise SystemExit(0)
          raw = subprocess.check_output(["security", "cms", "-D", "-i", str(prov)], stderr=subprocess.DEVNULL)
          pl = plistlib.loads(raw)
          ents = pl.get("Entitlements") or {}
          ent_path = Path(os.environ["RUNNER_TEMP"]) / "ent-main.plist"
          ent_path.write_bytes(plistlib.dumps(ents))
          print("wrote", ent_path)
          PY
            ENT="$RUNNER_TEMP/ent-main.plist"
            /usr/bin/codesign --force --sign "$IDHASH" --entitlements "$ENT" --generate-entitlement-der --timestamp=none "$APP"
            echo "main app re-sealed"
            rm -rf "$EXPORT"
            mkdir -p "$EXPORT/Payload"
            cp -a "$APP" "$EXPORT/Payload/Blackout.app"
            ( cd "$EXPORT" && zip -r -y -q Blackout.ipa Payload )
            IPA="$EXPORT/Blackout.ipa"
          fi

          ls -la "$IPA"
          echo "IPA ready: $IPA"
          if [ ! -f "$IPA" ]; then
            echo "No IPA. No upload."
            exit 1
          fi
          echo "IPA=$IPA" >> "$GITHUB_ENV"
          echo "NEXT_BUILD=$NEXT" >> "$GITHUB_ENV"

      - name: Upload IPA with AuthKey (no App Review)
        run: |
          set -euo pipefail
          if [ -z "${IPA:-}" ] || [ ! -f "$IPA" ]; then
            echo "No IPA. No upload."
            exit 1
          fi
          STOP='ASC API key cannot create or reuse signing certificates. In App Store Connect → Users and Access → Integrations → App Store Connect API, the key’s role must be Admin or Account Holder (not Developer, not App Manager). Account Holder/Admin: edit or replace APP_STORE_CONNECT_API_KEY with an Admin key.'
          set +e
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA" \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID" \
            2>&1 | tee "$RUNNER_TEMP/altool.log"
          UP=${PIPESTATUS[0]}
          set -e
          if [ "$UP" -ne 0 ]; then
            if grep -qiE 'HTTP 401|HTTP 403|not have permission|Unable to log in|403 Forbidden|401 Unauthorized' "$RUNNER_TEMP/altool.log"; then
              echo "$STOP"
            fi
            echo "Upload failed. Not faked."
            exit 1
          fi
          echo "Uploaded CFBundleVersion ${NEXT_BUILD}. Not submitted for App Review. No External Testing group."

      - name: Assign existing Internal group after VALID
        run: |
          set -euo pipefail
          WANT_BUILD="${NEXT_BUILD}" "$PYBIN" << 'PY'
          import json, os, time, urllib.error, urllib.parse, urllib.request
          import jwt

          key = os.environ["APP_STORE_CONNECT_API_KEY"].replace("\r\n", "\n").strip() + "\n"
          kid = os.environ["APP_STORE_CONNECT_KEY_ID"].strip()
          iss = os.environ["APP_STORE_CONNECT_ISSUER_ID"].strip()
          app = os.environ["ASC_APP_ID"]
          group = os.environ["ASC_INTERNAL_GROUP_ID"]
          want = (os.environ.get("WANT_BUILD") or "").strip()

          def token():
              now = int(time.time())
              t = jwt.encode(
                  {"iss": iss, "iat": now, "exp": now + 15 * 60, "aud": "appstoreconnect-v1"},
                  key,
                  algorithm="ES256",
                  headers={"kid": kid, "typ": "JWT"},
              )
              return t.decode() if isinstance(t, bytes) else t

          def req(method, url, body=None, tok=None):
              data = None if body is None else json.dumps(body).encode()
              r = urllib.request.Request(
                  url,
                  data=data,
                  method=method,
                  headers={
                      "Authorization": f"Bearer {tok or token()}",
                      "Content-Type": "application/json",
                      "Accept": "application/json",
                  },
              )
              try:
                  with urllib.request.urlopen(r, timeout=45) as resp:
                      raw = resp.read()
                      return resp.status, json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:
                  raw = e.read().decode()
                  try:
                      parsed = json.loads(raw)
                  except Exception:
                      parsed = {"raw": raw[:800]}
                  return e.code, parsed

          deadline = time.time() + 25 * 60
          last_tok = None
          last_tok_at = 0
          target = None
          while time.time() < deadline:
              if last_tok is None or time.time() - last_tok_at > 10 * 60:
                  last_tok = token()
                  last_tok_at = time.time()
              q = urllib.parse.urlencode({"filter[app]": app, "limit": "20", "sort": "-uploadedDate"})
              st, data = req("GET", "https://api.appstoreconnect.apple.com/v1/builds?" + q, tok=last_tok)
              if st != 200:
                  raise SystemExit(f"list {st} {data}")
              match = None
              for b in data.get("data") or []:
                  a = b.get("attributes") or {}
                  if str(a.get("version")) == want:
                      match = {"id": b["id"], "version": str(a.get("version")), "processingState": a.get("processingState"), "usesNonExemptEncryption": a.get("usesNonExemptEncryption")}
                      break
              if not match:
                  print("WAIT no build", want)
                  time.sleep(30)
                  continue
              target = match
              print("BUILD", json.dumps(target))
              if target["processingState"] in ("FAILED", "INVALID"):
                  raise SystemExit(2)
              if target["processingState"] != "VALID":
                  print("WAIT", target["processingState"])
                  time.sleep(30)
                  continue
              bid = target["id"]
              if target.get("usesNonExemptEncryption") is None:
                  st, data = req(
                      "PATCH",
                      f"https://api.appstoreconnect.apple.com/v1/builds/{bid}",
                      {"data": {"type": "builds", "id": bid, "attributes": {"usesNonExemptEncryption": False}}},
                      tok=last_tok,
                  )
                  print("PATCH", target["version"], st)
              st, data = req(
                  "POST",
                  f"https://api.appstoreconnect.apple.com/v1/betaGroups/{group}/relationships/builds",
                  {"data": [{"type": "builds", "id": bid}]},
                  tok=last_tok,
              )
              print("ASSIGN Internal", target["version"], st)
              if st >= 400 and st != 409:
                  print(json.dumps(data)[:500])
                  raise SystemExit(1)
              raise SystemExit(0)
          print("TIMEOUT", json.dumps(target))
          raise SystemExit(1)
          PY
