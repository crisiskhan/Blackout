# No human p12. KEEP Dist 45YLWHL6UP is reference-only. tools/tf_asc_signing.py
# always mints a runner-local Dist cert and binds Local-named App Store
# profiles to it. Never revoke KEEP. Never delete KEEP-named GHA profiles.
# Fire: push tf: commit on cursor/blackout-bible-v3-64d0, or tag tf-*,
# or workflow_dispatch git_ref (backup). Never pull_request. Never main.
# Never External / App Review / production. Do not add environment: —
# Auto-review / required reviewers must not gate this job.
# Default unsigned compile is xcodebuild.yml and must stay green without these secrets.
name: TestFlight Internal

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: "App tree to archive (not main). Backup when not using a tf: push or tf-* tag."
        required: true
        default: cursor/blackout-bible-v3-64d0
  push:
    branches: [cursor/blackout-bible-v3-64d0]
    tags: ['tf-*']

jobs:
  upload:
    name: AuthKey archive + Internal upload
    # 33931992681: macos-14 + Xcode 16.2 is iOS 18.2 SDK. Apple rejects
    # that for App Store Connect / TestFlight. Unsigned xcodebuild.yml
    # stays macos-14 + Xcode 16. Do not use macos-latest (floating default).
    # macos-15 ships Xcode 26; select 26.x explicitly (image default is 16.4).
    # Keep App Intents processor no-ops on the selected toolchain.
    # No GitHub Environment. Do not add environment: or required reviewers.
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/tf-')) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/cursor/blackout-bible-v3-64d0' && startsWith(github.event.head_commit.message, 'tf:'))
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_APP_ID: "6806388963"
      ASC_INTERNAL_GROUP_ID: "28035586-fce6-474f-9bc2-ef0f1f65306e"
    steps:
      - name: Require ASC AuthKey secrets
        run: |
          set -euo pipefail
          for name in APP_STORE_CONNECT_API_KEY APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_KEY_ID APPLE_TEAM_ID
          do
            eval "val=\${$name:-}"
            if [ -z "$val" ]; then
              echo "Required secret $name is empty. No archive. No upload."
              exit 1
            fi
          done
          echo "ASC AuthKey secrets are present (values not printed)."

      - uses: actions/checkout@v4
        with:
          # workflow_dispatch: inputs.git_ref. push branch or tf-* tag: github.sha
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.git_ref || github.sha }}

      - name: Fail closed on TestFlight archive killers
        run: python3 tools/test_ci_opt.py

      - name: Select Xcode 26
        run: |
          set -euo pipefail
          ls /Applications | grep -i xcode || true
          xcodebuild -version || true
          selected=""
          for app in \
            /Applications/Xcode_26.6.app \
            /Applications/Xcode_26.5.app \
            /Applications/Xcode_26.4.1.app \
            /Applications/Xcode_26.4.app \
            /Applications/Xcode_26.3.app \
            /Applications/Xcode_26.2.app \
            /Applications/Xcode_26.1.1.app \
            /Applications/Xcode_26.1.app \
            /Applications/Xcode_26.0.1.app \
            /Applications/Xcode_26.0.app \
            /Applications/Xcode_26.app
          do
            if [ -d "$app" ]; then
              sudo xcode-select -s "$app"
              selected="$app"
              break
            fi
          done
          xcodebuild -version
          xcode-select -p
          ver="$(xcodebuild -version | awk 'NR==1 {print $2}')"
          case "$ver" in
            26.*)
              echo "Using Xcode $ver at ${selected:-$(xcode-select -p)}"
              ;;
            *)
              echo "Need Xcode 26 on macos-15 (got ${ver:-unknown} at ${selected:-none})."
              echo "Need Xcode 26 for the iOS 26 SDK. Do not fall back to Xcode 16."
              exit 1
              ;;
          esac

      - name: Write AuthKey
        run: |
          set -euo pipefail
          KEYDIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$KEYDIR"
          HOME_KEY="$KEYDIR/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          TEMP_KEY="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$(printf '%s' "$APP_STORE_CONNECT_API_KEY" | tr -d '\r')" > "$HOME_KEY"
          cp "$HOME_KEY" "$TEMP_KEY"
          chmod 600 "$HOME_KEY" "$TEMP_KEY"
          echo "AUTH_KEY_PATH=$TEMP_KEY" >> "$GITHUB_ENV"
          echo "AuthKey written (path only, not contents)."

      - name: Python JWT venv
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/py"
          "$RUNNER_TEMP/py/bin/pip" install -q PyJWT cryptography
          echo "PYBIN=$RUNNER_TEMP/py/bin/python" >> "$GITHUB_ENV"

      - name: Create or reuse Distribution cert and App Store profiles
        run: |
          set -euo pipefail
          "$PYBIN" tools/tf_asc_signing.py

      - name: Next CFBundleVersion from ASC
        id: ver
        run: |
          set -euo pipefail
          "$PYBIN" << 'PY'
          import json, os, time, urllib.parse, urllib.request
          import jwt

          key = os.environ["APP_STORE_CONNECT_API_KEY"].replace("\r\n", "\n").strip() + "\n"
          kid = os.environ["APP_STORE_CONNECT_KEY_ID"].strip()
          iss = os.environ["APP_STORE_CONNECT_ISSUER_ID"].strip()
          app = os.environ["ASC_APP_ID"]
          now = int(time.time())
          tok = jwt.encode(
              {"iss": iss, "iat": now, "exp": now + 15 * 60, "aud": "appstoreconnect-v1"},
              key,
              algorithm="ES256",
              headers={"kid": kid, "typ": "JWT"},
          )
          if isinstance(tok, bytes):
              tok = tok.decode()
          q = urllib.parse.urlencode({"filter[app]": app, "limit": "50", "sort": "-version"})
          req = urllib.request.Request(
              "https://api.appstoreconnect.apple.com/v1/builds?" + q,
              headers={"Authorization": f"Bearer {tok}", "Accept": "application/json"},
          )
          with urllib.request.urlopen(req, timeout=45) as resp:
              data = json.loads(resp.read())
          nums = []
          for b in data.get("data") or []:
              v = str((b.get("attributes") or {}).get("version") or "")
              if v.isdigit():
                  nums.append(int(v))
          nxt = (max(nums) + 1) if nums else 1
          print(f"ASC existing CFBundleVersion max={max(nums) if nums else 'none'} next={nxt}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"next={nxt}\n")
          PY

      - name: Archive and export App Store IPA
        env:
          NEXT_CPV: ${{ steps.ver.outputs.next }}
        run: |
          set -euo pipefail
          chmod +x .github/ci/tf-archive.sh
          bash .github/ci/tf-archive.sh


      - name: Upload IPA with AuthKey (no App Review)
        run: |
          set -euo pipefail
          if [ -z "${IPA:-}" ] || [ ! -f "$IPA" ]; then
            echo "No IPA. No upload."
            exit 1
          fi
          if [ -z "${ASC_APP_ID:-}" ]; then
            echo "ASC_APP_ID empty. No upload."
            exit 1
          fi
          if [ -z "${NEXT_BUILD:-}" ]; then
            echo "NEXT_BUILD empty. No upload."
            exit 1
          fi
          SHORT="$(python3 - "$IPA" << 'PY'
          import plistlib, sys, zipfile
          ipa = sys.argv[1]
          short = "0.1.0"
          with zipfile.ZipFile(ipa) as zf:
              names = [
                  n
                  for n in zf.namelist()
                  if n.endswith("Payload/Blackout.app/Info.plist")
              ]
              if names:
                  pl = plistlib.loads(zf.read(names[0]))
                  got = str(pl.get("CFBundleShortVersionString") or "").strip()
                  if got:
                      short = got
          print(short)
          PY
          )"
          if [ -z "$SHORT" ]; then
            echo "CFBundleShortVersionString empty. No upload."
            exit 1
          fi
          STOP='ASC API key cannot create or reuse signing certificates. In App Store Connect → Users and Access → Integrations → App Store Connect API, the key’s role must be Admin or Account Holder (not Developer, not App Manager). Account Holder/Admin: edit or replace APP_STORE_CONNECT_API_KEY with an Admin key.'
          set +e
          # 33929367958: without --apple-id/--bundle-id altool picked the nested
          # MapLibre FMWK BID and −19000. Bind the primary ASC app only.
          # --upload-package is the Xcode 16.2 form that consumes these flags;
          # --file keeps the IPA path explicit. No MapLibre ASC app.
          xcrun altool --upload-package "$IPA" \
            --type ios \
            --file "$IPA" \
            --apple-id "$ASC_APP_ID" \
            --bundle-id com.crisiskhan.blackout \
            --bundle-version "$NEXT_BUILD" \
            --bundle-short-version-string "$SHORT" \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID" \
            2>&1 | tee "$RUNNER_TEMP/altool.log"
          UP=${PIPESTATUS[0]}
          set -e
          if [ "$UP" -ne 0 ]; then
            if grep -qiE 'HTTP 401|HTTP 403|not have permission|Unable to log in|403 Forbidden|401 Unauthorized' "$RUNNER_TEMP/altool.log"; then
              echo "$STOP"
            fi
            echo "Upload failed. Not faked."
            exit 1
          fi
          echo "Uploaded CFBundleVersion ${NEXT_BUILD}. Not submitted for App Review. No External Testing group."

      - name: Assign existing Internal group after VALID
        run: |
          set -euo pipefail
          # 33986112949: CPV 56 VALID + PATCH 200, then betaGroups 404.
          # Retry 404; 409 is already assigned. Helper comes from git_ref.
          WANT_BUILD="${NEXT_BUILD}" "$PYBIN" tools/tf_asc_assign.py
