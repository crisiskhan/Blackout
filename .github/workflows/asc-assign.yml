name: ASC assign Internal

on:
  workflow_dispatch:
    inputs:
      build:
        description: "CFBundleVersion to assign (empty = newest VALID needing sync)"
        required: false
        default: "11"

jobs:
  assign:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      WANT_BUILD: ${{ inputs.build }}
      ASC_APP_ID: "6806388963"
      ASC_INTERNAL_GROUP_ID: "28035586-fce6-474f-9bc2-ef0f1f65306e"
    steps:
      - uses: actions/checkout@v4
      - name: Poll ASC, clear compliance, assign Internal
        run: |
          set -euo pipefail
          python3 -m pip install -q PyJWT cryptography
          python3 tools/tf_asc_assign.py
